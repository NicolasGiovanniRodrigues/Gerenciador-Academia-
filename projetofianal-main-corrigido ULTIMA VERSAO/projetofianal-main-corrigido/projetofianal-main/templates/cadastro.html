<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Cadastro — Automatic Fit</title>
        <link rel="stylesheet"
              href="{{ url_for('static',filename='css/app.css') }}">
    </head>
    <body class="auth-body">
        <main class="auth-layout">
            <section class="auth-brand">
                <a href="{{ url_for('index') }}">
                    <img src="{{ url_for('static',filename='img/logo.png') }}"
                         alt="Automatic Fit">
                </a>
                <h1>
                    Automatic
                    <b>
                        Fit
                    </b>
                </h1>
                <p>
                    Gerencie aulas, horários e inscrições com
                    <br>
                    praticidade.
                </p>
            </section>
            <section class="auth-card register">
                <img class="auth-logo"
                     src="{{ url_for('static',filename='img/logo.png') }}"
                     alt="">
                <h2>Crie sua conta</h2>
                <p class="subtitle">Preencha os dados abaixo para começar.</p>
                {% include "mensagens.html" %}
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <label class="auth-field">
                        <span class="sr-only">E-mail</span>
                        <span class="field-icon">✉</span>
                        <input type="email"
                               name="email"
                               placeholder="E-mail"
                               required
                               maxlength="100"
                               value="{{ request.form.get('email', '') }}"
                               autocomplete="email">
                    </label>
                    <label class="auth-field">
                        <span class="sr-only">Nome completo</span>
                        <span class="field-icon">♙</span>
                        <input name="nome"
                               placeholder="Nome completo"
                               maxlength="254"
                               required
                               autocomplete="name"
                               value="{{ request.form.get('nome', '') }}">
                    </label>
                    <label class="auth-field">
                        <span class="sr-only">Telefone</span>
                        <span class="field-icon">♧</span>
                        <input type="tel"
                               name="telefone"
                               placeholder="Telefone"
                               maxlength="20"
                               autocomplete="tel"
                               value="{{ request.form.get('telefone', '') }}">
                    </label>
                    <label class="auth-field">
                        <span class="sr-only">CPF</span>
                        <span class="field-icon">▤</span>
                        <input name="cpf"
                               placeholder="CPF"
                               maxlength="14"
                               required
                               inputmode="numeric"
                               value="{{ request.form.get('cpf', '') }}">
                    </label>
                    <label class="auth-date">
                        Data de nascimento
                        <input type="date"
                               name="data_nascimento"
                               required
                               value="{{ request.form.get('data_nascimento', '') }}">
                    </label>
                    <label class="auth-field password-field">
                        <span class="sr-only">Senha</span>
                        <span class="field-icon">
                            <img src="{{ url_for('static',filename='img/cadeado.png') }}"
                                 width="15"
                                 height="15"
                                 alt="">
                        </span>
                        <input type="password"
                               name="senha"
                               placeholder="Senha"
                               required
                               minlength="8"
                               autocomplete="new-password">
                        <button type="button" class="show-password" aria-label="Mostrar senha">◉</button>
                    </label>
                    <label class="auth-field">
                        <span class="sr-only">Confirmar senha</span>
                        <span class="field-icon">
                            <img src="{{ url_for('static',filename='img/cadeado.png') }}"
                                 width="15"
                                 height="15"
                                 alt="">
                        </span>
                        <input type="password"
                               name="confirmar_senha"
                               placeholder="Confirmar senha"
                               minlength="8"
                               autocomplete="new-password"
                               required>
                    </label>
                    <p class="help">Mínimo de 8 caracteres: maiúscula, minúscula, número e símbolo.</p>
                    <button class="button primary full" type="submit">Cadastrar-se</button>
                    <p class="auth-link">
                        Já tem uma conta?
                        <a href="{{ url_for('login') }}">Fazer Login</a>
                    </p>
                </form>
            </section>
        </main>
        <script src="{{ url_for('static',filename='js/app.js') }}"></script>
    </body>
</html>
