<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Automatic Fit — {{ erro.code }}</title>
        <link rel="stylesheet"
              href="{{ url_for('static',filename='css/app.css') }}">
    </head>
    <body>
        <main class="error-page card">
            <h1>{{ erro.code }}</h1>
            <h2>
                {{ 'Acesso não permitido' if erro.code==403 else 'Página não encontrada' if erro.code==404 else 'Não foi possível concluir' }}
            </h2>
            <p>{{ erro.description if erro.code in [400,503] else 'Volte ao início para continuar.' }}</p>
            <a class="button primary"
               href="{{ url_for('voltar_home') if usuario else url_for('index') }}">Voltar ao início</a>
        </main>
    </body>
</html>
